name: release
# Publishes a fork Release with the APK.
#  - automatically, whenever an upstream merge builds green
#  - manually, via workflow_dispatch, from a chosen successful Build Commit run
on:
  workflow_run:
    workflows: ["Build Commit"]
    types: [completed]
  workflow_dispatch:
    inputs:
      source_run:
        description: "Build Commit run id to take the APK from (a successful run)"
        required: true
        type: string
      changelog:
        description: "Release-notes delta vs the previous version (notes carry only this plus the footer)"
        required: false
        default: "See FORK.md for the full patch list."
        type: string
permissions:
  contents: write
env:
  # Upstream release this fork's tree is based on. Shown in the release-notes
  # footer. Bump it whenever an upstream merge moves the base.
  UPSTREAM_BASE: "0.16.2"
jobs:
  release:
    # Automatic path: only upstream merges. Manual path: operator's choice, but the
    # chosen run must have succeeded, so a red build can never be published.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       contains(github.event.workflow_run.head_commit.message, 'merge upstream'))
    runs-on: ubuntu-latest
    steps:
      # Resolve first, then check out exactly that commit, so versionName is read
      # from the tree the APK was actually built from.
      - name: resolve source run
        id: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
          MANUAL_RUN: ${{ inputs.source_run }}
          AUTO_RUN: ${{ github.event.workflow_run.id }}
          AUTO_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [ "$MANUAL" = "true" ]; then
            RUN="$MANUAL_RUN"
            CONCLUSION=$(gh run view "$RUN" -R "${{ github.repository }}" --json conclusion --jq .conclusion)
            if [ "$CONCLUSION" != "success" ]; then
              echo "::error::run $RUN concluded '$CONCLUSION'; refusing to publish a failed build"
              exit 1
            fi
            SHA=$(gh run view "$RUN" -R "${{ github.repository }}" --json headSha --jq .headSha)
            KIND=manual
          else
            RUN="$AUTO_RUN"
            SHA="$AUTO_SHA"
            KIND=automated
          fi
          echo "run=$RUN" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "kind=$KIND" >> "$GITHUB_OUTPUT"
          echo "source: $KIND run $RUN ($SHA)"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}

      - name: download apk artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh run download "${{ steps.source.outputs.run }}" \
            -R "${{ github.repository }}" \
            -p "ReadYou-GitHub-Build-*" -D apk
          find apk -name "*.apk"

      - name: create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KIND: ${{ steps.source.outputs.kind }}
          SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          VER=$(grep -oE 'versionName *= *"[^"]+"' app/build.gradle.kts | grep -oE "[0-9.]+" | head -1)
          if [ "$KIND" = "manual" ]; then
            TAG="v${VER}"
            NOTES="${{ inputs.changelog }}

            ---
            Based on upstream ReadYou ${UPSTREAM_BASE} (Ashinch/ReadYou)."
          else
            TAG="v${VER}+psyquix.${{ github.run_number }}"
            NOTES="Automated build of upstream merge ($SHA).

            Fork changelog:
            - Feed icons: the feed's declared image first, then the site homepage icons, then the feed host (upstream uses the feed host only)
            - Large feeds no longer crash low-memory devices on subscribe preview (parsed feed kept out of Compose state)
            - Mark above/below as unread in the article long-press menu
            - Per-feed article-list scroll memory, restored across restarts
            - New setting: mark as read at end of article instead of on open (both renderers)

            Full details in FORK.md.

            Unit tests run before the APK is built and gate this release.

            ---
            Based on upstream ReadYou ${UPSTREAM_BASE} (Ashinch/ReadYou)."
          fi
          if gh release view "$TAG" -R "${{ github.repository }}" >/dev/null 2>&1; then
            echo "release $TAG exists, skipping"
            exit 0
          fi
          gh release create "$TAG" -R "${{ github.repository }}" \
            --title "$TAG" \
            --notes "$NOTES" \
            apk/**/*.apk
